[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["src/test command.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
